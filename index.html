<style>
:root{--g:#144336;--g2:#0d2d24;--gold:#e5a73b;--bg:#f7f4ed;--card:#fff;--ink:#1b2622;--mut:#5e6d66;--line:#e5ded4;--sand:#e5ded2;--cb:#b0562b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a16;--card:#18251f;--ink:#e8efeb;--mut:#9db2a8;--line:#2a3b33;--sand:#22332b;--cb:#e08a5c}}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 'Plus Jakarta Sans','Noto Serif Bengali','Noto Sans Devanagari',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:60}
a{color:inherit;text-decoration:none}button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:14px;align-items:center}
.brand h1{font:700 18px/1.1 Cinzel,serif;color:var(--g);letter-spacing:.02em}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand h1{color:var(--gold)}}
.brand p{font:italic 12px Lora,serif;color:var(--mut);margin-top:3px;max-width:46ch}
.mnav{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;font-weight:500}
.mnav a{padding:6px 2px}.mnav a:hover{color:var(--gold)}
.mnav a.on{background:var(--g);color:#fff;padding:6px 16px;border-radius:6px}
.lang{display:flex;border:1px solid var(--g);border-radius:6px;overflow:hidden}
.lang button{padding:5px 12px;font-size:12.5px}.lang button[aria-pressed=true]{background:var(--g);color:#fff}
.sub{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--g);color:#d1ded9;display:flex;align-items:center;gap:20px;padding:0 28px;height:48px;box-shadow:0 3px 12px rgba(0,0,0,.2);overflow-x:auto;scrollbar-width:none}
.sub b{font:600 16px Lora,serif;color:#fff;white-space:nowrap;margin-right:8px}
.sub a{font-size:12.5px;font-weight:500;white-space:nowrap;padding:14px 2px;border-bottom:2px solid transparent;transition:.2s}
.sub a:hover{color:#fff}.sub a.on{color:var(--gold);border-color:var(--gold)}
section{scroll-margin-top:60px}
/* hero carousel */
.hero{position:relative;height:clamp(430px,68vh,620px);overflow:hidden;background:#0b1a15;color:#fff;touch-action:pan-y}
.sl{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;visibility:hidden}
.sl.on{opacity:1;visibility:visible}
.bg{position:absolute;inset:0;transform:scale(1.02)}
.sl.on .bg{animation:kb 9s ease-out forwards}
@keyframes kb{to{transform:scale(1.12) translateX(-1.2%)}}
.bg svg{position:absolute;bottom:0;width:100%;height:60%}
.sl::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,20,15,.88),rgba(8,20,15,.3) 62%,rgba(8,20,15,.05)),linear-gradient(0deg,rgba(8,20,15,.55),transparent 40%)}
.sl .tx{position:absolute;z-index:3;left:max(28px,6vw);right:20px;top:clamp(40px,14vh,120px);max-width:520px;opacity:0;transform:translateY(24px);transition:.8s .35s}
.sl.on .tx{opacity:1;transform:none}
.chipa{display:inline-block;padding:4px 12px;border:1px solid rgba(229,167,59,.65);border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;background:rgba(8,20,15,.35)}
.tx h2{font:700 clamp(32px,5.4vw,54px)/1.1 Lora,'Noto Serif Bengali','Noto Sans Devanagari',serif;color:#fff;margin:0 0 14px;text-shadow:0 2px 18px rgba(0,0,0,.4)}
.tx p{max-width:440px;color:#e5ece8;margin-bottom:24px}
.cta{display:inline-block;background:var(--gold);color:#11271f;padding:11px 24px;border-radius:26px;font-weight:700;font-size:13.5px;border:0}
button.cta{cursor:pointer}.cta:hover{background:#f5b94e}
.cta.g{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);margin-left:8px}.cta.g:hover{background:rgba(255,255,255,.12)}
.arr{position:absolute;top:50%;z-index:6;width:40px;height:40px;border-radius:50%;background:rgba(18,38,30,.6);border:1px solid rgba(255,255,255,.3);color:#fff;transform:translateY(-50%)}
.arr:hover{border-color:var(--gold);color:var(--gold)}
.dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:6px}
.dots button{width:20px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden;position:relative;min-height:0}
.dots button.on::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:pg 6s linear forwards}
@keyframes pg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cnt{position:absolute;z-index:6;right:max(28px,4vw);bottom:16px;color:#e5ece8;font:600 13px Lora,serif;letter-spacing:.12em}
.cnt b{color:var(--gold);font-size:18px}
/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:54px 24px 8px}
.st{font:700 28px/1.2 Lora,'Noto Serif Bengali','Noto Sans Devanagari',serif}
.st::after{content:"";display:block;width:44px;height:3px;background:var(--g);margin:8px 0 18px}
.lead{max-width:70ch;color:var(--mut);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:.25s}
.c:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(20,67,54,.14)}
.k{display:block;width:100%;text-align:left}
.c .im{height:140px}.c .bd{padding:14px}
.c h4{font:700 15px Lora,'Noto Serif Bengali','Noto Sans Devanagari',serif}
.c p{font-size:12.5px;color:var(--mut);margin-top:4px}
/* map */
.mapbox{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
.map{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(20,67,54,.12);background:var(--sand)}
.mtools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.mtools .chips{margin-bottom:0}
.seg{display:flex;border:1px solid var(--g);border-radius:20px;overflow:hidden}
.seg button{padding:6px 14px;font-size:13px;min-height:36px}.seg button[aria-pressed=true]{background:var(--g);color:#fff}
#lmap{height:clamp(400px,64vh,620px);background:var(--sand);font:inherit;z-index:1}
.mfail{padding:40px 20px;text-align:center;color:var(--mut)}
.mctl{position:absolute;left:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mctl button{width:36px;height:36px;min-height:0;border-radius:8px;background:var(--card);color:var(--g);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:18px;line-height:1}
.mctl button:hover{background:var(--g);color:#fff}
.mwrap.fs{position:fixed;inset:0;z-index:90;background:var(--bg);padding:12px;display:flex;flex-direction:column}
.mwrap.fs .map{flex:1;min-height:0;display:flex;flex-direction:column}.mwrap.fs #lmap{height:auto;flex:1}
.mkw{background:none;border:0}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--g);border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.45);position:relative;transition:transform .2s,background .2s}
.mk.cb{background:var(--cb)}.mk.on{background:var(--gold);transform:rotate(-45deg) scale(1.25)}
.mkw:hover .mk{transform:rotate(-45deg) scale(1.15)}
.mkd{animation:drop .55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes drop{from{opacity:0;transform:translateY(-22px)}}
.mk i{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(45deg)}
.mk svg{width:14px;height:14px;fill:#fff}
.mleg{position:absolute;left:10px;bottom:34px;z-index:500;background:var(--card);opacity:.96;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:grid;gap:6px;max-width:230px}
.mleg b{font:700 11px 'Plus Jakarta Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mleg .r{display:flex;align-items:center;gap:7px}.mleg .d{width:11px;height:11px;border-radius:50%;flex:none}.mleg .al{background:var(--g)}.mleg .cb{background:var(--cb)}
.mleg svg{width:13px;height:13px;fill:var(--g);flex:none}.mleg .ap{color:var(--mut);font-size:11px;border-top:1px solid var(--line);padding-top:6px}
.mnote{display:none;position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:500;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--mut);box-shadow:0 3px 10px rgba(0,0,0,.2);text-align:center;max-width:80%}
#lmap.notiles~.mnote{display:block}
#lmap.notiles{background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(20,67,54,.09) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(20,67,54,.09) 39px 40px),var(--sand)}
@media(min-width:641px){.legend{display:none}}
@media(max-width:640px){.mleg{display:none}}
.leaflet-tooltip.mtip{font:600 12px 'Plus Jakarta Sans','Noto Serif Bengali','Noto Sans Devanagari',sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.25);padding:4px 9px}
.leaflet-tooltip-top.mtip::before{border-top-color:var(--card)}
.leaflet-popup-content-wrapper{border-radius:12px;padding:0;overflow:hidden;background:var(--card);color:var(--ink)}
.leaflet-popup-content{margin:0!important;width:240px!important;font:inherit}.leaflet-popup-tip{background:var(--card)}
.leaflet-container a.leaflet-popup-close-button{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);z-index:3}
.pthumb{position:relative;height:120px;overflow:hidden}.pthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}.pthumb img.l{opacity:1}
.pop .pb{padding:12px 14px 14px}.pop b{display:block;font:700 15px/1.3 Lora,'Noto Serif Bengali','Noto Sans Devanagari',serif}.pop span{font-size:12px;color:var(--mut)}
.pa{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pbtn{background:var(--g);color:#fff;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;min-height:0}.pbtn.g{background:transparent;color:var(--ink);border:1px solid var(--mut)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:0 2px 8px rgba(0,0,0,.2)!important;border-radius:8px!important;overflow:hidden}
.leaflet-bar a{background:var(--card);color:var(--g);border-bottom-color:var(--line)}.leaflet-bar a:hover{background:var(--g);color:#fff}
.leaflet-control-attribution{font-size:10px}
.legend{font-size:12.5px;color:var(--mut);margin-top:10px}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.info h3{font:700 20px Lora,'Noto Serif Bengali','Noto Sans Devanagari',serif;margin-bottom:6px}
.dthumb{height:130px;position:relative;border-radius:8px;overflow:hidden;margin-bottom:12px}
.plist{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;max-height:260px;overflow:auto}
.plist h5{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.pi{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px;border-left:3px solid transparent;min-height:0}
.pi:hover{background:var(--bg)}.pi.on{background:var(--bg);border-color:var(--gold);font-weight:600}
.btn{display:inline-block;margin-top:14px;background:var(--g);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600}
.tl{border-left:3px solid var(--g);margin:24px 0 0 8px;padding-left:20px;display:grid;gap:14px}
.tl b{color:var(--gold);font-family:Lora,serif}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
form{display:grid;gap:10px;max-width:520px}
input,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
footer{margin-top:60px;background:var(--g2);color:#c9dbd3;padding:18px 28px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:12.5px}
/* modal */
.mod{position:fixed;inset:0;z-index:100;background:rgba(5,15,11,.75);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
.mod.on{display:flex}
.art{background:var(--card);width:100%;max-width:720px;border-radius:12px;padding:30px clamp(18px,5vw,48px) 40px}
.art h2{font:700 30px/1.25 Lora,'Noto Serif Bengali','Noto Sans Devanagari',serif;margin:6px 0 4px}
.art .body p{font:400 var(--fs,18px)/1.85 Lora,'Noto Serif Bengali','Noto Sans Devanagari',serif;margin-top:16px;max-width:62ch}
.art .bar{display:flex;gap:6px;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}
.art .bar button{border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chips button{padding:6px 16px;border:1px solid var(--g);border-radius:20px;font-size:13px}.chips button[aria-pressed=true]{background:var(--g);color:#fff}
.gi{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:.25s}.gi:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(20,67,54,.14)}
.ph{position:relative;height:150px;overflow:hidden}.ph img,.big img,.dthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.gi span{display:block;padding:10px 12px;font:700 14px Lora,'Noto Serif Bengali','Noto Sans Devanagari',serif}
.big{position:relative;height:300px;border-radius:10px;overflow:hidden;margin:14px 0}
.pl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px;padding:12px;background:var(--bg);border-radius:10px;font-size:13px}.pl .btn{margin:0}.pl select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}#vn{color:#b0562b;flex-basis:100%}.rd{background:rgba(229,167,59,.28);border-radius:6px;box-shadow:0 0 0 6px rgba(229,167,59,.28)}
/* skeleton loader */
.sk{background:var(--sand)}
.sk::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shim 1.3s infinite;pointer-events:none}
.sk.ok::before{display:none}
@keyframes shim{to{transform:translateX(100%)}}
.ph img,.big img,.im img,.bg img,.dthumb img{opacity:0;transition:opacity .5s}
.ph img.l,.big img.l,.im img.l,.bg img.l,.dthumb img.l{opacity:1}
.im{position:relative;overflow:hidden}
.im img,.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:860px){.mapbox{grid-template-columns:1fr}.sign{display:none}.top{padding:12px 16px}.sub{padding:0 16px}}
/* responsive */
img,svg{max-width:100%}body{overflow-x:clip;font-size:clamp(14px,.35vw + 13px,16px)}
.menu{display:none;width:44px;height:44px;border:1px solid var(--g);border-radius:8px;font-size:22px;color:var(--g)}
.btn,.chips button,.zoom button,.arr{min-height:40px}input,textarea{font-size:16px}form{max-width:100%}
@media(hover:none){.c:hover,.gi:hover{transform:none;box-shadow:none}}
@media(min-width:1600px){.wrap{max-width:1500px}.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}
@media(max-width:1100px){.mnav{gap:4px 12px;font-size:13px}.top{padding:10px 20px}}
@media(max-width:900px){.lang{order:2;margin-left:auto}.menu{display:grid;place-items:center;order:2}.mnav{display:none;order:3;flex-basis:100%;flex-direction:column;gap:0;border-top:1px solid var(--line);padding-top:6px}.mnav.open{display:flex}.mnav a{padding:12px 6px;min-height:44px}.mnav a.on{padding:12px 14px}.brand{flex:1 1 220px}}
@media(max-width:640px){
.top{padding:10px 14px;gap:8px}.brand h1{font-size:15px}.brand p{display:none}.brand svg{width:44px;height:44px}
.sub{height:46px;padding:0 12px;gap:16px}.sub b{display:none}
.wrap{padding:28px 14px 4px}.st{font-size:23px}.st::after{margin:6px 0 14px}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}.cols{grid-template-columns:1fr}.ph{height:110px}.c .im{height:100px}.c .bd{padding:10px}.c h4{font-size:14px}
.hero{height:clamp(400px,66vh,520px)}.sl::after{background:linear-gradient(0deg,rgba(8,20,15,.92),rgba(8,20,15,.5) 60%,rgba(8,20,15,.15))}.sl .tx{top:auto;bottom:56px;left:18px}.tx p{font-size:14px;margin-bottom:16px}.tx h2{font-size:clamp(28px,9vw,40px);margin-bottom:10px}.arr{display:none}.cta{padding:12px 20px}.cta.g{display:none}
.dots{gap:4px;bottom:22px;left:18px;transform:none}.dots button{width:12px}.cnt{bottom:14px;right:16px}
.bg svg{height:70%}
.info{padding:16px}
#lmap{height:380px}
.mtools{gap:8px}
.seg button{padding:6px 10px;font-size:12px}
.c .btn{display:block;width:100%;text-align:center;margin-top:8px;padding:9px 6px;font-size:12.5px}
.mod{padding:0}.art{border-radius:0;min-height:100%;padding:16px 16px 36px}.art h2{font-size:24px}.art .bar button{padding:8px 12px}.big{height:220px}
.pl .btn{padding:10px 16px}.pl{gap:8px}.lead{font-size:14px}
.lang button{padding:7px 10px;font-size:12px}
footer{flex-direction:column;align-items:center;text-align:center;padding:18px 14px}}
@media(max-width:320px){.grid{grid-template-columns:1fr}}
@media(max-height:480px) and (orientation:landscape){.hero{height:auto;min-height:100vh}.sl .tx{top:20px;bottom:auto}.tx h2{font-size:30px;margin:2px 0 8px}.tx p{display:none}.sub{position:static}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---- professional map polish ---- */
.map{border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px rgba(20,67,54,.14)}
.map::after{display:none}
.map[data-base=street] .leaflet-tile-pane{filter:none}

/* round pins: white ring, soft shadow, pulse on selection */
.mk{width:34px;height:34px;border-radius:50%;border:3px solid #fff;transform:none;
    box-shadow:0 2px 4px rgba(0,0,0,.3),0 6px 14px rgba(0,0,0,.25)}

{t:["From Railway Town to District","রেলশহর থেকে জেলা","रेल नगर से ज़िले तक"],
 p:[["Alipurduar grew around the railway and the tea economy of the Dooars. Its junction connects North Bengal with Assam and the wider Northeast.","After the princely state of Cooch Behar merged with West Bengal in 1950, the area remained part of Jalpaiguri district.","Alipurduar became a district of its own on 25 June 2014."],
 ["রেলপথ ও ডুয়ার্সের চা-অর্থনীতিকে ঘিরেই আলিপুরদুয়ার গড়ে ওঠে। এর জংশন উত্তরবঙ্গকে অসম ও বৃহত্তর উত্তর-পূর্বের সঙ্গে যুক্ত করেছে।","১৯৫০ সালে কোচবিহার রাজ্য পশ্চিমবঙ্গে মিশে গেলে এলাকাটি জলপাইগুড়ি জেলার অংশ থাকে।","২০১৪ সালের ২৫ জুন আলিপুরদুয়ার আলাদা জেলা হয়।"],
 ["अलीपुरद्वार रेलवे और डुआर्स की चाय अर्थव्यवस्था के इर्द-गिर्द बसा। इसका जंक्शन उत्तर बंगाल को असम और पूर्वोत्तर से जोड़ता है।","1950 में कूचबिहार रियासत के पश्चिम बंगाल में विलय के बाद यह क्षेत्र जलपाईगुड़ी ज़िले का हिस्सा रहा।","25 जून 2014 को अलीपुरद्वार अलग ज़िला बना।"]]},
{t:["Jaldapara: Rhino Country","জলদাপাড়া: গণ্ডারের দেশ","जलदापाड़ा: गैंडों का देश"],
 p:[["Jaldapara lies on the floodplain of the Torsa river, a mix of tall grassland and riverine forest.","It became a wildlife sanctuary in 1941 and a national park in 2012. It is best known for the Indian one-horned rhinoceros.","Elephants, deer and many birds also live here, and visitors explore the park on forest safaris."],
 ["জলদাপাড়া তোর্সা নদীর বন্যাসমভূমিতে অবস্থিত; এখানে উঁচু তৃণভূমি ও নদীতীরের বন মিলেমিশে আছে।","১৯৪১ সালে এটি অভয়ারণ্য হয় এবং ২০১২ সালে জাতীয় উদ্যানের মর্যাদা পায়। ভারতীয় একশৃঙ্গ গণ্ডারের জন্য এটি সবচেয়ে বিখ্যাত।","এখানে হাতি, হরিণ ও নানা পাখিরও বাস। দর্শনার্থীরা বন-সাফারিতে ঘুরে দেখেন।"],
 ["जलदापाड़ा तोर्सा नदी के बाढ़ मैदान में बसा है, जहाँ ऊँचे घास के मैदान और नदी किनारे के जंगल मिलते हैं।","1941 में यह अभयारण्य बना और 2012 में राष्ट्रीय उद्यान का दर्जा मिला। यह भारतीय एक सींग वाले गैंडे के लिए सबसे प्रसिद्ध है।","यहाँ हाथी, हिरण और कई पक्षी भी रहते हैं। पर्यटक वन सफ़ारी से इसे देखते हैं।"]]},
{t:["Tea and the Making of the Dooars","চা ও ডুয়ার্সের গড়ে ওঠা","चाय और डुआर्स का निर्माण"],
 p:[["Tea planting began in the Dooars in the 1870s, soon after the British took control of the region.","Planters brought workers from Chota Nagpur and Nepal to clear forest and pluck leaf. Santhal, Oraon, Munda and Nepali families settled in labour lines beside the gardens.","Their languages, songs and festivals are now part of everyday life in Alipurduar, and tea remains a major source of work."],
 ["ব্রিটিশরা অঞ্চলটির নিয়ন্ত্রণ নেওয়ার অল্পদিন পরেই, ১৮৭০-এর দশকে ডুয়ার্সে চা-চাষ শুরু হয়।","বন কেটে চা-পাতা তোলার জন্য বাগান-মালিকরা ছোটনাগপুর ও নেপাল থেকে শ্রমিক আনেন। সাঁওতাল, ওরাওঁ, মুন্ডা ও নেপালি পরিবার বাগানের পাশের শ্রমিক-বসতিতে থিতু হয়।","তাঁদের ভাষা, গান ও উৎসব আজ আলিপুরদুয়ারের দৈনন্দিন জীবনের অংশ, আর চা এখনও কর্মসংস্থানের বড় উৎস।"],
 ["अंग्रेज़ों के क्षेत्र पर नियंत्रण के कुछ ही समय बाद, 1870 के दशक में डुआर्स में चाय की खेती शुरू हुई।","बागान मालिक जंगल साफ़ करने और पत्ती तोड़ने के लिए छोटानागपुर और नेपाल से श्रमिक लाए। संथाल, उराँव, मुंडा और नेपाली परिवार बागानों के पास श्रमिक बस्तियों में बस गए।","उनकी भाषाएँ, गीत और त्योहार आज अलीपुरद्वार के रोज़मर्रा के जीवन का हिस्सा हैं, और चाय अब भी रोज़गार का बड़ा स्रोत है।"]]},
{t:["The Toto of Totopara","টোটোপাড়ার টোটো","तोतोपाड़ा के तोतो"],
 p:[["The Toto live mainly in Totopara, a village near the Bhutan border in the Madarihat area.","They are one of India’s smallest tribal communities and are recognised as a Particularly Vulnerable Tribal Group.","Protecting their language, customs and land is a central task of heritage work in the district."],

function useLayer(k,i){

function info(){

  const sec=(id,ti,body,lead)=>`<section id="${id}"><div class="wrap"><h2 class="st">${ti}</h2>${lead?`<p class="lead">${lead}</p>`:""}${body}</div></section>`;
  const ms=MS.map((m,mi)=>{
    if(m[0]=="maps")return sec("maps",t("maps"),`<div class="mapbox"><div id="mapwrap" class="mwrap"><div class="mtools"><div class="chips" role="group">${Object.keys(GC).map(k=>`<button data-mf="${k}" aria-pressed="${mfilter==k}">${GC[k][L]}</button>`).join("")}</div><div class="seg" role="group">${[["street","mst"],["terrain","mte"],["sat","msa"]].map(([k,l])=>`<button data-mb="${k}" aria-pressed="${base==k}">${t(l)}</button>`).join("")}</div></div><div class="map"><div id="lmap" role="region" aria-label="${t("maps")}"></div><div class="mctl"><button data-reset aria-label="${t("reset")}" title="${t("reset")}">⌖</button><button data-fs aria-label="${t("fs")}" title="${t("fs")}">⛶</button></div>${legendHtml()}<div class="mnote">${t("mapnotile")}</div></div><p class="legend"><span style="color:var(--g)">●</span> ${AR.al[L]} &nbsp; <span style="color:var(--cb)">●</span> ${AR.cb[L]} · ${t("approx")}</p></div><aside class="info" id="info" aria-live="polite">${info()}</aside></div><div class="tl">${TLN.map(x=>`<div><b>${x[0]}</b><br>${x[1][L]}</div>`).join("")}</div>`);
    const items=m[2].length?m[2].map((x,i)=>({name:x[L],p:PM[m[3][i]]})):m[3].map(id=>({name:PM[id].n[L],p:PM[id]}));
    return sec(m[0],t(m[0]),`<div class="grid">${items.map((x,i)=>card(x.name,i+mi,"",x.p)).join("")}</div>`,m[1][L])}).join("");
  document.getElementById("app").innerHTML=hero+
   sec("about",t("about"),"",t("aboutT"))+
   sec("work",t("work"),`<div class="grid">${WORK.map((w,i)=>card(w[L],i)).join("")}</div>`)+
   `<section id="museum"><div class="wrap" style="padding-bottom:0"><h2 class="st">${t("museum")}</h2><p class="lead">${t("note")}</p></div></section>`+ms+
   sec("news",t("news"),`<div class="cols">${NEWS.map((x,i)=>`<div class="c">${tile(i+2)}<div class="bd"><h4>${x[L]}</h4><p>${["12 Nov 2026","03 Dec 2026","20 Jan 2027"][i]}</p><a class="btn" href="#contact">${t("contact")}</a></div></div>`).join("")}</div>`)+
   sec("pubs",t("pubs"),`<div class="grid">${PUB.map((x,i)=>`<div class="c">${tile(i+1,PM[PUB_PH[i]])}<div class="bd"><h4>${x[L]}</h4><button class="btn" data-art="${PUB_ART[i]}">${t("read")}</button></div></div>`).join("")}${ART.map((a,i)=>`<div class="c"><div class="bd"><h4>${a.t[L]}</h4><button class="btn" data-art="${i}">${t("read")}</button> <button class="btn" data-art="${i}" data-play="1">▶ ${t("listen")}</button></div></div>`).join("")}</div><button class="btn" data-bull>▶ ${t("bull")}</button>`)+
   sec("gallery",t("gallery"),galleryHtml())+
   sec("contact",t("contact"),`<form id="cf"><input required placeholder="${t("nm")}" aria-label="${t("nm")}"><input type="email" required placeholder="${t("em")}" aria-label="${t("em")}"><textarea rows="4" required placeholder="${t("ms")}" aria-label="${t("ms")}"></textarea><button class="btn" style="width:fit-content;margin:0">${t("send")}</button><p id="ok" style="color:var(--g);font-weight:600"></p></form>`);
  loadSlide(cur);loadSlide(cur+1);spy();initMap();
}
// ---------- carousel: only the current and next photo are fetched ----------
function loadSlide(i){const s=document.querySelectorAll(".sl");if(!s.length)return;const im=s[(i+s.length)%s.length].querySelector("img[data-src]");if(im){im.srcset=im.dataset.srcset;im.src=im.dataset.src;im.removeAttribute("data-src")}}
function go(i){const n=HP.length;cur=(i+n)%n;document.querySelectorAll(".sl").forEach((s,k)=>s.classList.toggle("on",k===cur));document.querySelectorAll(".dots button").forEach((d,k)=>{d.classList.remove("on");if(k===cur){void d.offsetWidth;d.classList.add("on")}});const c=document.getElementById("cn");if(c)c.textContent=String(cur+1).padStart(2,"0");loadSlide(cur);loadSlide(cur+1);clearInterval(timer);timer=setInterval(()=>go(cur+1),6000)}
// ---------- article reader ----------
let fs=18;
function openArt(i,play){showArt(i);if(play)speak([i]);else stopSpeak()}
let shown=null;function showArt(i){shown=i;const a=ART[i];document.getElementById("art").style.setProperty("--fs",fs+"px");
  document.getElementById("art").innerHTML=`<div class="bar"><span>${t("museum")}</span><span><button data-f="-1" aria-label="Smaller text">A−</button> <button data-f="1" aria-label="Larger text">A+</button> <button data-x>${t("close")}</button></span></div><h2>${a.t[L]}</h2><div class="pl"><button class="btn" id="ppb" data-pp></button><button class="btn" data-st>■ ${t("stop")}</button><label>${t("spd")} <select data-sp>${[0.8,1,1.25,1.5].map(r=>`<option value="${r}"${r==rate?" selected":""}>${r}×</option>`).join("")}</select></label>${vsHtml()}<span id="vn"></span></div><div class="body">${a.p[L].map((x,k)=>`<p id="p${k}">${x}</p>`).join("")}</div>`;
  document.getElementById("mod").classList.add("on");setBtn()}
const closeArt=()=>{stopSpeak();document.getElementById("mod").classList.remove("on")};
// ---------- audio reader (Web Speech API) ----------
const SS=window.speechSynthesis,LC=["en-IN","bn-IN","hi-IN"];let Q=[],qi=0,pi=0,paused=false,rate=1,tok=0;
const vsel={},nl=x=>x.lang.toLowerCase().replace("_","-"),nat=s=>L==1?s.replace(/(\d)–(\d)/g,"$1 থেকে $2").replace(/[0-9]/g,d=>"০১২৩৪৫৬৭৮৯"[d]):L==2?s.replace(/(\d)–(\d)/g,"$1 से $2").replace(/[0-9]/g,d=>"०१२३४५६७८९"[d]):s;
function vlist(){return SS?SS.getVoices().filter(x=>nl(x).startsWith(LC[L].slice(0,2))):[]}
function voice(){const ms=vlist(),lc=LC[L].toLowerCase();return ms.find(x=>x.voiceURI==vsel[L])||ms.find(x=>/natural|neural|online/i.test(x.name)&&nl(x)==lc)||ms.find(x=>nl(x)==lc)||ms.find(x=>/google/i.test(x.name))||ms[0]}
function vsHtml(){const ms=vlist(),c=voice();return ms.length>1?`<label id="vsb">${t("vc")} <select data-vc>${ms.map(x=>`<option value="${x.voiceURI}"${c&&c.voiceURI==x.voiceURI?" selected":""}>${x.name}</option>`).join("")}</select></label>`:`<span id="vsb"></span>`}
if(SS)SS.addEventListener("voiceschanged",()=>{const p=document.getElementById("vsb");if(p)p.outerHTML=vsHtml()});
document.addEventListener("change",e=>{if(e.target.matches("[data-vc]"))vsel[L]=e.target.value});
function setBtn(){const b=document.getElementById("ppb");if(b)b.textContent=paused?"▶ "+t("resume"):(SS&&SS.speaking&&Q.length)?"⏸ "+t("pause"):"▶ "+t("listen")}
function speak(l){if(!SS){alert(t("nov"));return}stopSpeak();Q=l;qi=0;pi=0;if(SS.getVoices().length)next();else{const f=()=>{SS.removeEventListener("voiceschanged",f);if(Q===l)next()};SS.addEventListener("voiceschanged",f);setTimeout(()=>{if(Q===l&&pi==0&&!SS.speaking)f()},1500)}}
function next(){if(qi>=Q.length)return stopSpeak();if(shown!==Q[qi])showArt(Q[qi]);
 const a=ART[Q[qi]],u=[a.t[L],...a.p[L]];if(pi>=u.length){qi++;pi=0;return next()}
 document.querySelectorAll(".art .body p").forEach((p,k)=>p.classList.toggle("rd",k==pi-1));
 const el=document.getElementById("p"+(pi-1));if(el)el.scrollIntoView({block:"center",behavior:"smooth"});
 const s=new SpeechSynthesisUtterance(nat(u[pi])),v=voice(),my=tok;s.lang=v?v.lang:LC[L];if(v)s.voice=v;s.rate=L?rate*.9:rate;
 const vn=document.getElementById("vn");if(vn)vn.textContent=(v||!L)?"":t("nv2");
 s.onend=()=>{if(my===tok){pi++;next()}};if(L&&!v){stopSpeak();return}SS.speak(s);setTimeout(setBtn,120)}
function toggleSpeak(){if(!SS){alert(t("nov"));return}if(paused){SS.resume();paused=false}else if(SS.speaking&&Q.length){SS.pause();paused=true}else speak([shown]);setBtn()}
function stopSpeak(){tok++;if(SS)SS.cancel();paused=false;Q=[];document.querySelectorAll(".rd").forEach(p=>p.classList.remove("rd"));setBtn();setTimeout(setBtn,80)}
document.addEventListener("change",e=>{if(e.target.matches("[data-sp]"))rate=+e.target.value});
// ---------- events ----------
document.addEventListener("click",e=>{const q=s=>e.target.closest(s);let x;
  if(x=q("#lang button")){L=+x.dataset.l;render();const m=document.getElementById("mod");if(m.classList.contains("on"))closeArt()}
  else if(x=q("[data-d]"))go(cur+ +x.dataset.d);
  else if(x=q("[data-g]"))go(+x.dataset.g);
  else if(x=q("[data-pi]"))pick(x.dataset.pi,true);
  else if(x=q("[data-mf]")){mfilter=x.dataset.mf;document.querySelectorAll("[data-mf]").forEach(b=>b.setAttribute("aria-pressed",b===x));applyFilter(true)}
  else if(x=q("[data-mb]"))setBase(x.dataset.mb);
  else if(q("[data-reset]"))resetView();
  else if(q("[data-fs]"))toggleFs();
  else if(x=q("[data-map]")){closeArt();exitFs();document.getElementById("maps").scrollIntoView();pick(x.dataset.map,true)}
  else if(x=q("[data-art]"))openArt(+x.dataset.art,x.dataset.play);
  else if(x=q("[data-gf]")){gf=x.dataset.gf;document.querySelectorAll("[data-gf]").forEach(b=>b.setAttribute("aria-pressed",b===x));document.getElementById("gal").innerHTML=galleryInner()}
  else if(x=q("[data-p]"))openPlace(x.dataset.p);
  else if(q("[data-pp]"))toggleSpeak();
  else if(q("[data-st]"))stopSpeak();
  else if(q("[data-bull]"))speak(ART.map((_,i)=>i));
  else if(x=q("[data-f]")){fs=Math.max(14,Math.min(28,fs+2*x.dataset.f));document.getElementById("art").style.setProperty("--fs",fs+"px")}
  else if(q("[data-x]")||e.target.id=="mod")closeArt()});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){closeArt();exitFs()}if((e.key=="Enter"||e.key==" ")&&e.target.classList&&e.target.classList.contains("pin")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("submit",e=>{e.preventDefault();document.getElementById("ok").textContent=t("sent");e.target.reset()});
// ---------- scroll-spy: sub-nav (museum sections) and main nav ----------
let io,mio;
function spy(){
  if(io)io.disconnect();if(mio)mio.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)document.querySelectorAll("#sub a").forEach(a=>{const on=a.dataset.s===en.target.id;a.classList.toggle("on",on);if(on)a.scrollIntoView({block:"nearest",inline:"center"})})}),{rootMargin:"-45% 0px -50% 0px"});
  MS.forEach(m=>io.observe(document.getElementById(m[0])));
  mio=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const id=MS.some(m=>m[0]==en.target.id)?"museum":en.target.id;document.querySelectorAll("#mnav a").forEach(a=>a.classList.toggle("on",a.dataset.m===id))}}),{rootMargin:"-45% 0px -50% 0px"});
  ["home","about","work","museum","photos","docs","sites","oral","comm","pers","maps","research","news","pubs","gallery","contact"].forEach(i=>{const n=document.getElementById(i);if(n)mio.observe(n)});
}
document.addEventListener("click",e=>{const m=document.getElementById("mnav");if(e.target.closest("#menu")){const o=m.classList.toggle("open");document.getElementById("menu").setAttribute("aria-expanded",o)}else if(e.target.closest("#mnav a"))m.classList.remove("open")});
let tx0=null;document.addEventListener("touchstart",e=>{tx0=e.target.closest(".hero")?e.touches[0].clientX:null},{passive:true});
document.addEventListener("touchend",e=>{if(tx0===null)return;const d=e.changedTouches[0].clientX-tx0;if(Math.abs(d)>50)go(cur+(d<0?1:-1));tx0=null},{passive:true});
render();go(0);
</script>
</body>
